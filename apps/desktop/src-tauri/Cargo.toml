[package]
name = "doc-anonymizer"
# 版本号不在这里"自己说了算": 它与 packages/docanon-core/pyproject.toml、
# src-tauri/tauri.conf.json 三处必须一致, 由 tests/test_desktop.py 锁住。
# (界面的版本号从 /health 读, 是同一个数字 —— 只准有一处真相。)
version = "0.4.0"
description = "本地文档脱敏 (Tauri 桌面壳: 系统 WebView + Python 侧车)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 只为一件事: 把报错文案安全地塞进 eval 的 JS 字符串(自己拼引号迟早会被中文引号咬到)
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
