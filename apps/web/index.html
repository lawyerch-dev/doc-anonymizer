<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档脱敏工具</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header>
  <h1>文档脱敏工具</h1>
  <span class="sub">选文档 → 预览 → 一键脱敏 → 原格式前后对比</span>
</header>

<!-- 顶部: 操作细节(一行) + 运行日志入口 -->
<div class="toolbar">
  <span id="opDetails">未选择文档</span>
  <span id="err" class="err hidden" style="margin:0"></span>
  <button class="mini" id="toggleLog" disabled>运行日志</button>
</div>

<!-- 运行日志弹窗 -->
<div id="logModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><b>运行日志</b><button class="mini" id="logClose">关闭 ✕</button></div>
    <div class="modal-body" id="logBody"></div>
  </div>
</div>

<div class="layout">
  <aside class="side">
    <div class="card">
      <div class="card-head"><h3>选择文档</h3><button class="mini" id="refresh" title="重新加载 samples/ 里的示例">↻ 刷新示例</button></div>
      <div id="presets"></div>
      <button class="ghost" id="upload" style="width:100%;margin-top:6px">上传本地文件…</button>
      <button id="run" style="width:100%;margin-top:8px" disabled>开始脱敏</button>
      <input type="file" id="file" class="hidden" />
    </div>
    <div class="card hidden" id="statsCard">
      <h3>命中统计</h3>
      <table id="stats"></table>
    </div>
  </aside>

  <main>
    <div class="panes">
      <section class="pane">
        <div class="bar"><b>原文</b><span id="srcName"></span>
          <span class="right"><a class="linkbtn hidden" id="dlSrc"><button class="ghost">下载原件</button></a></span></div>
        <div class="body" id="paneSrc"><div class="placeholder">左侧选择或上传一个文档</div></div>
      </section>
      <section class="pane">
        <div class="bar"><b>脱敏后</b><span id="outName"></span>
          <span class="right"><a class="linkbtn hidden" id="dlOut"><button class="ghost">下载脱敏件</button></a></span></div>
        <div class="body" id="paneOut"><div class="placeholder">点击「开始脱敏」查看结果</div></div>
      </section>
    </div>
  </main>
</div>

<script src="/file-viewer/flyfish-file-viewer-web-full.iife.js"></script>
<script src="/app.js"></script>
</body>
</html>
