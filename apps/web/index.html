<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档脱敏工具</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--fg:#1b1f24;--muted:#6b7280;--accent:#2563eb;--line:#e5e7eb;--ok:#059669;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100%;overflow:hidden;overscroll-behavior:none}
  header{padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex:0 0 auto}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--muted);font-size:13px}

  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  button:disabled{background:#c7ccd4;cursor:not-allowed}
  button.ghost{background:#eef2ff;color:var(--accent)}
  .mini{background:#eef2ff;color:var(--accent);border:0;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .mini:disabled{opacity:.5;cursor:default}
  a.linkbtn{display:inline-flex;text-decoration:none}
  a.linkbtn.hidden{display:none}

  /* 顶部: 操作细节(一行) + 运行日志入口 */
  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 24px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
  .toolbar #opDetails{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .toolbar #toggleLog{margin-left:auto}

  /* 运行日志弹窗(不影响原布局) */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal.hidden{display:none}
  .modal-box{background:#0f172a;color:#e2e8f0;width:50vw;height:50vh;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.45)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #334155;background:#111827;font-size:14px}
  .modal-body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px;font-size:12px;line-height:1.7}
  .modal-body .meta{color:#94a3b8;margin-bottom:8px}
  .modal-body code{background:#1e293b;padding:1px 6px;border-radius:4px;color:#e2e8f0}
  .modal-body table{color:#e2e8f0}
  .modal-body th,.modal-body td{border-color:#334155;padding:5px 8px;vertical-align:top}
  .modal-body th{color:#94a3b8}
  .modal-body .arrow{color:#64748b}

  .layout{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px 24px;max-width:1500px;margin:0 auto;flex:1;min-height:0;width:100%}
  .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-head h3{margin:0}
  .preset{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px;transition:.12s;overflow:hidden;max-width:100%}
  .preset:hover{border-color:var(--accent);background:#eff6ff}
  .preset.active{border-color:var(--accent);background:#eff6ff;color:var(--accent);font-weight:600}
  .preset>span:first-child{flex:0 0 auto}
  .preset>span:nth-child(2){flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .preset .tag{flex:0 0 auto;margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase}

  .panes{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%;min-height:0}
  .pane{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;height:100%}
  .pane .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;min-height:44px}
  .pane .bar b{font-weight:600}
  .pane .bar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pane .bar .right{margin-left:auto;display:flex;gap:8px}
  .pane .bar button{padding:4px 10px;font-size:12px;line-height:1.2}
  .pane .body{flex:1;position:relative;min-height:0;overflow:hidden}
  .pane .body>div{position:absolute;inset:0}
  .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-direction:column;gap:8px}
  pre.raw{margin:0;padding:14px;overflow:auto;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;position:absolute;inset:0;background:#fff}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:8px 12px;border-radius:8px;font-size:12px}
  .hidden{display:none}
  .spin{width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;animation:r .7s linear infinite;vertical-align:-2px}
  @keyframes r{to{transform:rotate(360deg)}}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>文档脱敏工具</h1>
  <span class="sub">选文档 → 预览 → 一键脱敏 → 原格式前后对比</span>
</header>

<!-- 顶部: 操作细节(一行) + 运行日志入口 -->
<div class="toolbar">
  <span id="opDetails">未选择文档</span>
  <span id="err" class="err hidden" style="margin:0"></span>
  <button class="mini" id="toggleLog" disabled>运行日志</button>
</div>

<!-- 运行日志弹窗 -->
<div id="logModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><b>运行日志</b><button class="mini" id="logClose">关闭 ✕</button></div>
    <div class="modal-body" id="logBody"></div>
  </div>
</div>

<div class="layout">
  <aside class="side">
    <div class="card">
      <div class="card-head"><h3>选择文档</h3><button class="mini" id="refresh" title="重新加载 samples/ 里的示例">↻ 刷新示例</button></div>
      <div id="presets"></div>
      <button class="ghost" id="upload" style="width:100%;margin-top:6px">上传本地文件…</button>
      <button id="run" style="width:100%;margin-top:8px" disabled>开始脱敏</button>
      <input type="file" id="file" class="hidden" />
    </div>
    <div class="card hidden" id="statsCard">
      <h3>命中统计</h3>
      <table id="stats"></table>
    </div>
  </aside>

  <main>
    <div class="panes">
      <section class="pane">
        <div class="bar"><b>原文</b><span id="srcName"></span>
          <span class="right"><a class="linkbtn hidden" id="dlSrc"><button class="ghost">下载原件</button></a></span></div>
        <div class="body" id="paneSrc"><div class="placeholder">左侧选择或上传一个文档</div></div>
      </section>
      <section class="pane">
        <div class="bar"><b>脱敏后</b><span id="outName"></span>
          <span class="right"><a class="linkbtn hidden" id="dlOut"><button class="ghost">下载脱敏件</button></a></span></div>
        <div class="body" id="paneOut"><div class="placeholder">点击「开始脱敏」查看结果</div></div>
      </section>
    </div>
  </main>
</div>

<script src="/file-viewer/flyfish-file-viewer-web-full.iife.js"></script>
<script>
const FV = window.FlyfishFileViewerWebFull;
if (FV && FV.setDefaultFullAssetBaseUrl) FV.setDefaultFullAssetBaseUrl(new URL('/file-viewer/', location.href).href);

const state = { preset: null, token: null, filename: null, url: null, trace: null, logOpen: false };
const $ = id => document.getElementById(id);
const TEXT_EXT = ['txt', 'md', 'markdown', 'csv'];

function mount(containerId, url, filename) {
  const el = $(containerId);
  el.innerHTML = '';
  const inner = document.createElement('div');
  inner.style.position = 'absolute'; inner.style.inset = '0';
  el.appendChild(inner);
  const ext = (filename.split('.').pop() || '').toLowerCase();
  if (TEXT_EXT.includes(ext)) { return showText(inner, url); }
  if (FV && FV.mountViewer) {
    try {
      FV.mountViewer(inner, {
        url: new URL(url, location.href).href,
        filename,
        // theme 必须放 options 里(顶层会被忽略); toolbar:false 关外层工具栏;
        // pdf.toolbar/navigation 关 PDF 内部工具栏/缩略图栏(否则窄窗格横向溢出、re-fit 抖动)。
        options: { theme: 'light', toolbar: false, pdf: { toolbar: false, navigation: false } },
      });
      return;
    } catch (e) { console.warn('file-viewer mount failed', e); }
  }
  showText(inner, url);
}

async function showText(el, url) {
  try {
    const r = await fetch(url);
    const t = await r.text();
    const pre = document.createElement('pre');
    pre.className = 'raw'; pre.textContent = t;
    el.appendChild(pre);
  } catch (e) {
    el.innerHTML = '<div class="placeholder">无法预览: ' + e.message + '</div>';
  }
}

function resetOutput() {
  state.trace = null;
  $('outName').textContent = '';
  $('dlOut').classList.add('hidden');
  $('paneOut').innerHTML = '<div class="placeholder">点击「开始脱敏」查看结果</div>';
  $('statsCard').classList.add('hidden');
  $('logModal').classList.add('hidden');
  $('toggleLog').disabled = true;
}

function selectDoc({ preset, token, filename, url }) {
  state.preset = preset; state.token = token;
  state.filename = filename; state.url = url;
  $('srcName').textContent = filename;
  $('dlSrc').href = url; $('dlSrc').classList.remove('hidden');
  $('run').disabled = false;
  resetOutput();
  $('opDetails').textContent = '已选择: ' + filename;
  mount('paneSrc', url, filename);
}

function selectPreset(p, node) {
  document.querySelectorAll('.preset').forEach(n => n.classList.remove('active'));
  node.classList.add('active');
  selectDoc({ preset: p.name, token: null, filename: p.name, url: p.url });
}

async function loadPresets() {
  const box = $('presets');
  const btn = $('refresh');
  if (btn) { btn.disabled = true; }
  box.innerHTML = '<div class="hint">加载中…</div>';
  try {
    const { presets } = await (await fetch('/api/presets', { cache: 'no-store' })).json();
    box.innerHTML = '';
    if (!presets.length) { box.innerHTML = '<div class="hint">samples/ 无可预览示例</div>'; return; }
    presets.forEach(p => {
      const n = document.createElement('div');
      n.className = 'preset';
      n.title = p.name;
      n.innerHTML = '<span>📄</span><span>' + p.name + '</span><span class="tag">' +
        (p.name.split('.').pop()) + '</span>';
      n.onclick = () => selectPreset(p, n);
      box.appendChild(n);
    });
  } catch (e) {
    box.innerHTML = '<div class="hint">加载失败: ' + e.message + '</div>';
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

$('refresh').onclick = loadPresets;

$('upload').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  const btn = $('upload'); btn.disabled = true; const old = btn.textContent; btn.textContent = '上传中…';
  try {
    const buf = new Uint8Array(await f.arrayBuffer());
    let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    const resp = await (await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: f.name, content_b64: btoa(s) }) })).json();
    if (resp.error) throw new Error(resp.error);
    document.querySelectorAll('.preset').forEach(n => n.classList.remove('active'));
    selectDoc({ preset: null, token: resp.token, filename: resp.filename, url: resp.url });
  } catch (e) {
    showErr('上传失败: ' + e.message);
  } finally { btn.disabled = false; btn.textContent = old; }
};

$('run').onclick = async () => {
  const btn = $('run'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 脱敏中';
  $('err').classList.add('hidden');
  try {
    const body = state.preset ? { preset: state.preset } : { token: state.token };
    const resp = await (await fetch('/api/anonymize', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) })).json();
    if (resp.error) throw new Error(resp.error);
    $('outName').textContent = resp.output_name;
    $('dlOut').href = resp.output_url; $('dlOut').classList.remove('hidden');
    mount('paneOut', resp.output_url, resp.output_name);
    renderStats(resp.counts);
    state.trace = resp.trace || null;
    renderOpDetails(resp);
    $('toggleLog').disabled = !state.trace;
    $('logModal').classList.add('hidden');
  } catch (e) {
    showErr('脱敏失败: ' + e.message);
  } finally { btn.disabled = false; btn.textContent = '开始脱敏'; }
};

$('toggleLog').onclick = () => {
  if (!state.trace) return;
  renderLog(state.trace);
  $('logModal').classList.remove('hidden');
};
$('logClose').onclick = () => $('logModal').classList.add('hidden');
$('logModal').onclick = (e) => { if (e.target === $('logModal')) $('logModal').classList.add('hidden'); };

function totalCounts(counts) { return Object.values(counts || {}).reduce((a, b) => a + b, 0); }

function renderOpDetails(resp) {
  const c = resp.counts || {};
  const types = Object.keys(c).join('+') || '无命中';
  const t = (resp.trace && resp.trace.timing) || {};
  const ms = t.total_ms != null ? Math.round(t.total_ms) + 'ms' : '';
  $('opDetails').textContent =
    '已脱敏 ' + resp.output_name + ' · 类型 ' + types + ' · 命中 ' + totalCounts(c) + ' · ' + ms;
  $('opDetails').title = JSON.stringify(c);
}

function renderLog(tr) {
  const t = tr.timing || {};
  const meta =
    '<div class="meta">' +
    '源文件 <code>' + esc(tr.source) + '</code> · 抽取器 <code>' + esc(tr.extractor) + '</code> · ' +
    '检测器 <code>' + esc((tr.detectors || []).join(' + ')) + '</code><br>' +
    '耗时: 抽取 ' + (t.extract_ms ?? '-') + 'ms · 检测 ' + (t.detect_ms ?? '-') + 'ms · ' +
    '回写 ' + (t.write_ms ?? '-') + 'ms · 合计 <b>' + (t.total_ms ?? '-') + 'ms</b>' +
    '</div>';
  const rows = (tr.detections || []).map(d =>
    '<tr><td>' + esc(d.entity_type) + '</td><td>' + esc(d.source) + '</td><td>' + esc(d.strategy) + '</td>' +
    '<td><code>' + esc(d.original) + '</code></td><td class="arrow">→</td>' +
    '<td><code>' + esc(d.replacement || '（删除）') + '</code></td><td>' + esc(locText(d.locator)) + '</td></tr>'
  ).join('');
  const table = (tr.detections || []).length
    ? '<table><tr><th>类型</th><th>来源</th><th>策略</th><th>原文</th><th></th><th>替换为</th><th>位置</th></tr>' + rows + '</table>'
    : '<div class="meta">本次未命中任何敏感信息。</div>';
  $('logBody').innerHTML = meta + table;
}

function locText(loc) {
  if (!loc) return '';
  if ('line' in loc) return '第' + (loc.line + 1) + '行';
  if ('page' in loc) return '第' + (loc.page + 1) + '页' + (loc.bbox ? '(图)' : '');
  if ('sheet' in loc) return loc.sheet + '!' + loc.cell;
  if ('row' in loc) return 'r' + loc.row + 'c' + loc.col;
  if ('t' in loc) return '表' + loc.t + ' r' + loc.r + 'c' + loc.c;
  return JSON.stringify(loc);
}

function renderStats(counts) {
  const entries = Object.entries(counts || {});
  $('statsCard').classList.remove('hidden');
  $('stats').innerHTML = '<tr><th>类型</th><th>数量</th></tr>' +
    (entries.length ? entries.map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('')
      : '<tr><td colspan="2" style="color:var(--muted)">未命中</td></tr>');
}
function showErr(msg) { const e = $('err'); e.textContent = msg; e.classList.remove('hidden'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

loadPresets();
</script>
</body>
</html>
