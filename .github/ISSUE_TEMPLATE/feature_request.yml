name: 功能建议
description: 新格式、新检测引擎、界面改进等
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述场景，而不是先给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / 现有办法
  - type: checkboxes
    id: scope
    attributes:
      label: 是否触及这些边界（见 AGENTS.md）
      options:
        - label: 要新增一个检测引擎（需实现 capabilities()/ready() 并在注册表登记）
        - label: 要新增一种文件格式（需走 manifest 的 ok|error|unsupported 三态）
        - label: 要让某个引擎在起不来时"降级继续"（本项目默认不允许，见"少一层必须报错"）
        - label: 要引入新的运行时依赖或联网调用
