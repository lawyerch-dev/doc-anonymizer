# 桌面版可分发包: macOS(.app/.dmg) 与 Windows(-setup.exe)。
#
# **为什么必须在各自系统上原生构建**: PyInstaller 不做交叉编译, 而 Tauri 打出来的也是宿主平台的
# 原生包(Windows 上是 NSIS 安装器)。所以这里是个矩阵, 两个平台各自跑同一条 `scripts/dev.sh dist`
# —— 打包步骤只有一份实现, CI 不复制它。
#
# 产物去向: 打 tag(v*) 时传到 GitHub Release; 手动触发时只留 Actions artifact(用来试跑)。
# **未签名未公证**: macOS 首次要右键→「打开」, Windows 首次要「更多信息」→「仍要运行」。
#
# 这里不跑测试套件: 门禁在 deploy-website.yml(文档/架构)与本地 `npm test`(引擎全量)。
# 这个 workflow 只管"能不能打出包" —— 打不出来就红, 打出来就是能跑过的树。
name: 打包桌面版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 建 Release、传资产

jobs:
  dist:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # 一个平台挂了不该把另一个平台的产物也吞掉: 两边的问题往往互不相关
      fail-fast: false
      matrix:
        include:
          # macos-15 = arm64(macos-15-intel 才是 Intel); 产品**只发 Apple Silicon**
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    env:
      # 用 runner 自己的 python(setup-python 装的那个), 不建 venv —— dev.sh 的 py_cmd 认这个变量。
      # 少一步建 venv, 也就不用把 Windows 的 Scripts/ 差异抄进 workflow。
      DOCANON_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Rust 工具链是换掉 Hutch 之后新增的一步: Tauri CLI 由 npm 装(@tauri-apps/cli),
      # 但编译壳本身要 rustc/cargo。缓存挂在 src-tauri 上, 第二次跑省掉整轮依赖编译。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 装五个包(editable)
        shell: bash
        run: python -m pip install -q --upgrade pip && python -m pip install -q -r requirements-dev.txt

      - name: "装前端依赖(npm workspaces: packages/ui + apps/web + apps/desktop)"
        run: npm ci

      # 前端产物 / 预览资源(232MB) / OCR 权重 / PyInstaller 侧车 / 摆资源根 / 打安装包
      # 全在这一条里 —— 与本地 `npm run dist:desktop` 是同一条路径。
      # Windows 上也用 bash: scripts/*.sh 与 dev.sh 都是 bash, git-bash 在 runner 上是现成的。
      - name: 打可分发包
        shell: bash
        run: ./scripts/dev.sh dist

      # "资源真的进了包吗"这件事不能靠"构建绿了"推断: 资源根没进包的症状是**装完才能发现**
      # 的(界面打开是空白/预览区 404)。所以这里直接看包内有没有那个标记文件。
      - name: 检查包内资源根
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            marker=apps/desktop/src-tauri/target/release/bundle/macos/doc-anonymizer.app/Contents/Resources/docanon/configs/default.yaml
          else
            marker=""
          fi
          if [ -n "$marker" ]; then
            [ -f "$marker" ] || { echo "包内没有资源根: $marker"; exit 1; }
            echo "包内资源根就位: $marker"
          else
            # Windows 的 NSIS 安装器是个自解压 exe, 包内布局要装完才看得到 ——
            # 那一侧由下面的冒烟测试用**同一棵树**(stage/docanon)兜住
            echo "Windows: 资源根布局由冒烟测试覆盖"
          fi

      # 全量留一份(含 .app 目录与中间产物, 排查用), 手动触发时这就是唯一产物
      - uses: actions/upload-artifact@v4
        with:
          name: doc-anonymizer-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/release/bundle/*/*
          if-no-files-found: error

      # 冒烟: 用**打进安装包的那份侧车**把全部样例真跑一遍(含 png/扫描 pdf, 会走 OCR)。
      # CI 是干净环境, 这一步拦的是"打得出、装上也打不开"那类问题 —— Windows 上尤其要紧
      # (依赖没打全、OCR 权重没进包, 都是构建能过、用户双击才炸, 而我们在那边没有机器)。
      # 用 configs/default.yaml: 只用规则+词典, 不需要模型(CI 上没有模型)。
      - name: "冒烟测试(包内侧车跑一遍全部样例, 含 OCR)"
        shell: bash
        run: |
          set -euo pipefail
          exe=apps/desktop/build/sidecar/docanon-server/docanon-server
          [ -f "$exe" ] || exe="$exe.exe"
          [ -f "$exe" ] || { echo "没找到包内 sidecar: $exe"; exit 1; }
          DOCANON_ROOT="$PWD/apps/desktop/stage/docanon" \
          DOCANON_DATA="$RUNNER_TEMP/docanon-smoke" \
            "$exe" run samples -o "$RUNNER_TEMP/smoke-out" -c configs/default.yaml
          echo "样例全部处理完 —— 包内侧车与 OCR 链路在 ${{ matrix.target }} 上可用"

      # Release 只传用户真正要的:
      #   macOS   → doc-anonymizer_<版本>_aarch64.dmg          (拖进「应用程序」)
      #   Windows → doc-anonymizer_<版本>_x64-setup.exe        (双击就装, 不再是"解压出 Setup.exe")
      # 用白名单而不是排除法, 但**必须兜住"一个都没匹配到"**: 漏发在网页上完全看不出来。
      - name: 传到 Release(仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob   # 没有匹配时别把字面量路径当成真文件传上去
          tag="${GITHUB_REF_NAME}"
          # 两个平台并行跑; 谁先到谁建 release, 后到的用已有那份(不 --generate-notes 覆盖)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          assets=()
          for f in apps/desktop/src-tauri/target/release/bundle/*/*; do
            case "$f" in *.dmg | *-setup.exe) assets+=("$f") ;; esac
          done
          [ ${#assets[@]} -gt 0 ] || { echo "没找到可分发的产物(dmg / *-setup.exe)"; exit 1; }
          printf '要传的资产:\n'; printf '  %s\n' "${assets[@]}"
          gh release upload "$tag" "${assets[@]}" --clobber
