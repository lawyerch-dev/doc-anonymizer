# 通用（本机小模型）
# 讲课、写案例用：人名、机构名、地址也一起换掉。在本机跑，不用联网。
# ONNX 路线: 规则 + 词典 + ONNX 中文 NER, 不依赖 llama.cpp
# 脱敏产物一律是 {{TYPE_N}} 锚点：**不含原文、可直接外发**，事后能一键还原（见 README）。
# 想要"打码/盖掉"那种外观（不需要还原时）：在界面 L2 逐类型策略里改成 mask / redact / remove；
# 想要可信假名就把 PERSON/ORG 改成 pseudonym（假名不可寻址，还原不了）。
strategies:
  PHONE: anchor
  ID_CARD: anchor
  PASSPORT: anchor
  PLATE: anchor
  BANK_CARD: anchor
  EMAIL: anchor
  IP: anchor
  USCC: anchor
  PERSON: anchor
  ORG: anchor
  LOCATION: anchor
  AMOUNT: anchor
  DOB: anchor
  SECRET: anchor        # 不用 remove —— 删掉就没有锚点，事后连位置都找不回来
  CUSTOM: anchor
  DEFAULT: anchor

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  onnx_ner: true
  llm_ner: false

onnx:
  # 默认两个都开: gyr66 出机构/人名/地址/角色, pii-engineer 出人名/手机/身份证/地址。
  # 基准集上 gyr66 单独就满召回(12/12, 7ms), 但真实材料里两边抓到的并不完全重合 —— 按"宁多勿漏"
  # 默认都开(代价: 首次"准备"约 780MB)。只想要一个: 删掉下面一行, 并删掉 var/models/onnx 里对应目录。
  model_dirs:
    - var/models/onnx/gyr66
    - var/models/onnx/pii-engineer

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  disable_thinking: true
