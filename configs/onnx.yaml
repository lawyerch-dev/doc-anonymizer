# 通用（本机小模型）
# 讲课、写案例用：人名、机构名、地址也一起换掉。在本机跑，不用联网。
# ONNX 路线: 规则 + 词典 + ONNX 中文 NER, 不依赖 llama.cpp
# 默认用 ** 盖掉人名/机构(不产假名); 想要可信假名就把 PERSON/ORG 改成 pseudonym
strategies:
  PHONE: mask
  ID_CARD: mask
  PASSPORT: mask
  PLATE: mask
  BANK_CARD: mask
  EMAIL: mask
  IP: redact
  USCC: mask
  PERSON: redact
  ORG: redact
  LOCATION: redact
  AMOUNT: redact
  DOB: redact
  SECRET: remove
  CUSTOM: redact
  DEFAULT: redact

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  onnx_ner: true
  llm_ner: false

onnx:
  # 默认只要 gyr66 一个: 实测(scripts/bench_detectors.py --no-llm)它单独就是 12/12 全召回,
  # 加 pii-engineer 取并集没有增量, 却要多下 390MB —— 首次"准备"因此从 780MB 降到 390MB。
  # 想要的自己加上: `./scripts/dev.sh models --only pii-engineer`, 再把这行按注释加回 model_dirs。
  model_dirs:
    - var/models/onnx/gyr66
    # - var/models/onnx/pii-engineer   # 可选: 中文 PII(人名/手机/地址/身份证)

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  disable_thinking: true
