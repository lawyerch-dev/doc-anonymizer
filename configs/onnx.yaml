# ONNX 路线: 规则 + 词典 + ONNX 中文 NER, 不依赖 llama.cpp
# 默认用 ** 盖掉人名/机构(不产假名); 想要可信假名就把 PERSON/ORG 改成 pseudonym
strategies:
  PHONE: mask
  ID_CARD: mask
  PASSPORT: mask
  PLATE: mask
  BANK_CARD: mask
  EMAIL: mask
  IP: redact
  USCC: mask
  PERSON: redact
  ORG: redact
  LOCATION: redact
  AMOUNT: redact
  DOB: redact
  SECRET: remove
  CUSTOM: redact
  DEFAULT: redact

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  onnx_ner: true
  llm_ner: false

onnx:
  # 多个模型取并集: gyr66(机构/人名) + pii-engineer(人名/手机/地址/身份证)
  model_dirs:
    - var/models/onnx/gyr66
    - var/models/onnx/pii-engineer

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  disable_thinking: true

ocr:
  enabled: true
