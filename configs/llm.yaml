# 最准（本地大模型）
# 讲课、写案例、对外分享时用：认得更全（能读懂复杂说法），但机构名和金额也会一起抹掉。
# 与 default.yaml 相同, 但打开 LLM NER 检测器(用哪个模型在 configs/llm_models.yaml 里选)
# 脱敏产物一律是 {{TYPE_N}} 锚点：**不含原文、可直接外发**，事后能一键还原（见 README）。
# 想要"打码/盖掉"那种外观（不需要还原时）：在界面 L2 逐类型策略里改成 mask / redact / remove。
strategies:
  PHONE: anchor
  ID_CARD: anchor
  PASSPORT: anchor
  PLATE: anchor
  BANK_CARD: anchor
  EMAIL: anchor
  IP: anchor
  USCC: anchor
  PERSON: anchor
  ORG: anchor
  LOCATION: anchor
  AMOUNT: anchor
  DOB: anchor
  SECRET: anchor
  CUSTOM: anchor
  DEFAULT: anchor

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  llm_ner: true

llm:
  # 用哪个模型: id 取自 configs/llm_models.yaml。选了这个, Web 会自己把服务起好再用。
  # 留空则改用下面 base_url/model 指向的"已经跑起来的服务"(自备服务, 高级)。
  model_id: qwen3.8-4b-distill
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  chunk_size: 1000
  disable_thinking: true
