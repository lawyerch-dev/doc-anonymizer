# 与 default.yaml 相同, 但打开 LLM NER 检测器(需先启动 llama-server)
# 默认用 ** 盖掉人名/机构(不产假名); 想要可信假名就把 PERSON/ORG 改成 pseudonym
strategies:
  PHONE: mask
  ID_CARD: mask
  PASSPORT: mask
  PLATE: mask
  BANK_CARD: mask
  EMAIL: mask
  IP: redact
  USCC: mask
  PERSON: redact
  ORG: redact
  LOCATION: redact
  AMOUNT: redact
  SECRET: remove
  CUSTOM: redact
  DEFAULT: redact

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  llm_ner: true

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  chunk_size: 1000
  disable_thinking: true

ocr:
  enabled: true
