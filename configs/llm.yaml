# 最准（本地大模型）
# 讲课、写案例、对外分享时用：认得更全（能读懂复杂说法），但机构名和金额也会一起抹掉。
# 与 default.yaml 相同, 但打开 LLM NER 检测器(用哪个模型在 configs/llm_models.yaml 里选)
# 默认用 ** 盖掉人名/机构(不产假名); 想要可信假名就把 PERSON/ORG 改成 pseudonym
strategies:
  PHONE: mask
  ID_CARD: mask
  PASSPORT: mask
  PLATE: mask
  BANK_CARD: mask
  EMAIL: mask
  IP: redact
  USCC: mask
  PERSON: redact
  ORG: redact
  LOCATION: redact
  AMOUNT: redact
  SECRET: remove
  CUSTOM: redact
  DEFAULT: redact

dictionary:
  - 内部项目代号
  - 某客户名

detectors:
  rule: true
  dictionary: true
  llm_ner: true

llm:
  # 用哪个模型: id 取自 configs/llm_models.yaml。选了这个, Web 会自己把服务起好再用。
  # 留空则改用下面 base_url/model 指向的"已经跑起来的服务"(自备服务, 高级)。
  model_id: qwen3.8-4b-distill
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 180
  chunk_size: 1000
  disable_thinking: true
