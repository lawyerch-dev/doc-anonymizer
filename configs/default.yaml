# doc-anonymizer 默认配置
# 各实体类型的脱敏策略: redact(整体 **) | mask(打码) | placeholder(<TYPE_n>) | pseudonym(假名) | remove | keep
# 默认用 **: 绝不产出像真的内容("假名/假公司"只在你显式配 pseudonym 时才用)
strategies:
  PHONE: mask          # 138****0000 / 010****4321
  ID_CARD: mask        # 保留前6后4
  PASSPORT: mask       # 保留首尾
  PLATE: mask          # 保留首位
  BANK_CARD: mask      # 保留后4
  EMAIL: mask          # a***@example.com
  IP: redact
  USCC: mask           # 统一社会信用代码
  PERSON: redact       # 张三 -> **
  ORG: redact          # XX公司 -> **
  LOCATION: redact
  AMOUNT: redact
  SECRET: remove       # key/token/密码 直接删除
  CUSTOM: redact
  DEFAULT: redact      # 没列出的类型一律 **

# 自定义业务敏感词(词典检测器)。命中即标为 CUSTOM
dictionary:
  - 内部项目代号
  - 某客户名
  # - 加更多

# 旧版 Office(.doc/.xls/.wps) 自动转成 .docx/.xlsx 再脱敏(需 LibreOffice); 关掉则一律视为不支持
legacy_convert: true

detectors:
  rule: true
  dictionary: true
  onnx_ner: false      # ONNX 中文 NER(需 var/models/onnx/*)
  llm_ner: false       # 需先启动 llama-server

onnx:
  # 可多个, 结果取并集(如 gyr66 出机构, pii-engineer 出地址)
  model_dirs:
    - var/models/onnx/gyr66
    - var/models/onnx/pii-engineer
  # entity_map: {标签: 实体类型}  # 写了就整表覆盖 app 侧默认映射(config.py 的 DEFAULT_ONNX_ENTITY_MAP)

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 120
  # 分块送模型的最大字符数
  chunk_size: 1000
  # 关闭 Qwen3.x thinking 模式, 直接出 JSON
  disable_thinking: true

ocr:
  # rapidocr 自动选择，无需额外配置；保留占位
  enabled: true
