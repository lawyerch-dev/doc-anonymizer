# 最快（只用规则）
# 只认格式固定的号码：手机号、身份证、银行卡、邮箱这类。不装任何模型也能用。
# 脱敏产物一律是 {{TYPE_N}} 锚点：**不含原文、可直接外发**，事后能一键还原（见 README）。
# 锚点把原文换成一个编号，交出去看不出内容，但映射表一对照就能填回来 —— 这是默认口径。
# 想要"打码/盖掉"那种外观（不需要还原时）：在界面 L2 逐类型策略里改成 mask / redact / remove。
strategies:
  PHONE: anchor
  ID_CARD: anchor
  PASSPORT: anchor
  PLATE: anchor
  BANK_CARD: anchor
  EMAIL: anchor
  IP: anchor
  USCC: anchor
  PERSON: anchor
  ORG: anchor
  LOCATION: anchor
  AMOUNT: anchor
  SECRET: anchor        # 不用 remove —— 删掉就没有锚点，事后连位置都找不回来
  CUSTOM: anchor
  DEFAULT: anchor

# 自定义业务敏感词(词典检测器)。命中即标为 CUSTOM
dictionary:
  - 内部项目代号
  - 某客户名
  # - 加更多

# 旧版 Office(.doc/.xls/.wps) 自动转成 .docx/.xlsx 再脱敏(需 LibreOffice); 关掉则一律视为不支持
legacy_convert: true

detectors:
  rule: true
  dictionary: true
  onnx_ner: false      # ONNX 中文 NER(需 var/models/onnx/*)
  llm_ner: false       # 本地大模型(Web 里选了模型会自动起服务)

onnx:
  # 可多个, 结果取并集(如 gyr66 出机构, pii-engineer 出地址)
  model_dirs:
    - var/models/onnx/gyr66
    - var/models/onnx/pii-engineer
  # entity_map: {标签: 实体类型}  # 写了就整表覆盖 app 侧默认映射(config.py 的 DEFAULT_ONNX_ENTITY_MAP)

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.8-4b
  timeout: 120
  # 分块送模型的最大字符数
  chunk_size: 1000
  # 关闭 Qwen3.x thinking 模式, 直接出 JSON
  disable_thinking: true
