<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文档脱敏工具</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:860px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  #drop { border:2px dashed #cbd5e1; border-radius:12px; padding:40px; text-align:center; color:var(--muted);
          cursor:pointer; transition:.15s; }
  #drop.hover { border-color:var(--accent); background:#eff6ff; color:var(--accent); }
  #drop b { color:var(--fg); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px;
           font-size:14px; cursor:pointer; }
  button:disabled { background:#9ca3af; cursor:not-allowed; }
  button.ghost { background:#eef2ff; color:var(--accent); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; overflow:auto;
        font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
  img.preview { max-width:100%; border:1px solid var(--line); border-radius:8px; }
  .err { color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; padding:10px 12px; border-radius:8px; }
  .spin { width:16px; height:16px; border:2px solid #fff; border-top-color:transparent; border-radius:50%;
          display:inline-block; animation:r .7s linear infinite; vertical-align:-3px; }
  @keyframes r { to { transform:rotate(360deg); } }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>文档脱敏工具</h1>
  <div class="sub">本地运行 · 支持 Word / PDF / 扫描件 / 图片 / 表格 · 中文优先</div>

  <div class="card">
    <div id="drop">
      <div style="font-size:32px">📄</div>
      <div style="margin-top:8px"><b>拖拽文件到这里</b> 或点击选择</div>
      <div style="margin-top:6px;font-size:12px">支持 .docx .pdf .txt .md .xlsx .csv .png .jpg</div>
    </div>
    <input type="file" id="file" class="hidden" />
    <div class="row">
      <span id="fname" style="color:var(--muted);font-size:13px">未选择文件</span>
      <button id="run" disabled>开始脱敏</button>
    </div>
  </div>

  <div id="err" class="err hidden"></div>

  <div id="stats" class="card hidden">
    <h3 style="margin:0 0 10px;font-size:15px">命中统计</h3>
    <table id="stats-table"></table>
  </div>

  <div id="result" class="card hidden">
    <div class="row" style="margin:0 0 12px">
      <h3 style="margin:0;font-size:15px">脱敏结果</h3>
      <button class="ghost" id="dl-result">下载结果</button>
      <button class="ghost" id="dl-map">下载映射表</button>
    </div>
    <div id="result-body"></div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const runBtn = document.getElementById('run');
const fnameEl = document.getElementById('fname');
let current = null;

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hover');
  if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
fileInput.onchange = () => fileInput.files[0] && pick(fileInput.files[0]);

function pick(f) {
  current = f;
  fnameEl.textContent = f.name + '  (' + (f.size/1024).toFixed(1) + ' KB)';
  runBtn.disabled = false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('stats').classList.add('hidden');
  document.getElementById('err').classList.add('hidden');
}

function b64(buf) {
  let s = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function ub64(str) {
  const bin = atob(str); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

runBtn.onclick = async () => {
  if (!current) return;
  runBtn.disabled = true; runBtn.innerHTML = '<span class="spin"></span> 处理中';
  document.getElementById('err').classList.add('hidden');
  try {
    const content_b64 = b64(await current.arrayBuffer());
    const resp = await fetch('/api/anonymize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: current.name, content_b64 }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch (e) {
    const err = document.getElementById('err');
    err.textContent = '处理失败: ' + e.message; err.classList.remove('hidden');
  } finally {
    runBtn.disabled = false; runBtn.textContent = '开始脱敏';
  }
};

function render(data) {
  // 统计
  const st = document.getElementById('stats');
  const tbl = document.getElementById('stats-table');
  const entries = Object.entries(data.counts || {});
  tbl.innerHTML = '<tr><th>类型</th><th>数量</th></tr>' +
    (entries.length ? entries.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')
                    : '<tr><td colspan="2" style="color:var(--muted)">未命中任何敏感信息</td></tr>');
  st.classList.remove('hidden');

  const body = document.getElementById('result-body');
  const dlResult = document.getElementById('dl-result');
  const dlMap = document.getElementById('dl-map');
  if (data.kind === 'text') {
    body.innerHTML = '<pre></pre>';
    body.querySelector('pre').textContent = data.text;
    dlResult.onclick = () => download(data.output_name, new Blob([data.text], { type: 'text/plain' }));
  } else {
    body.innerHTML = '<img class="preview" />';
    body.querySelector('img').src = 'data:image/png;base64,' + data.image_b64;
    dlResult.onclick = () => download(data.output_name,
      new Blob([ub64(data.image_b64)], { type: 'image/png' }));
  }
  dlMap.onclick = () => download('mapping.json',
    new Blob([data.mapping], { type: 'application/json' }));
  document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
