[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docanon-engine-ner-llm"
version = "0.2.0"
description = "docanon LLM NER 引擎: llama-server(OpenAI 兼容)传输层 + 检测器"
authors = [{ name = "lawyerch" }]
requires-python = ">=3.10,<3.14"
# 传输层用标准库 urllib, 不需要 HTTP 客户端库
dependencies = ["docanon-contract"]

[tool.setuptools.packages.find]
where = ["src"]
