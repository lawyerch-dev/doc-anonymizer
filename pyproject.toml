[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-anonymizer"
version = "0.1.0"
description = "本地文档脱敏工具: 抽取 + 检测 + 按类型脱敏"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "pypdfium2>=4.20",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ocr = ["rapidocr>=2.0.0", "onnxruntime>=1.17", "Pillow>=10.0"]
dev = ["pytest>=7.0"]

[project.scripts]
docanon = "docanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
