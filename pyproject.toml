# 工作区根: 这里没有代码也没有包, 只放工作区级的工具配置。
#   - 各包: packages/*/pyproject.toml
#   - 安装: requirements-dev.txt(五个包 editable + 测试依赖)
#   - 测试: 包内单元测试在 packages/*/tests/, 跨包/端到端在 tests/
#
# 部署契约(与 packages/docanon-core/src/docanon_core/resources.py 的说明同源):
#   只支持两种形态 ——
#     1) editable 安装: pip install -r requirements-dev.txt, 资源就在源码树里;
#     2) 打包根: configs/ samples/ apps/web/ 与代码同级, 由 DOCANON_ROOT 或 PyInstaller 的 _MEIPASS 指定。
#   **不做 wheel 自包含**: 前端 vendor(232MB)与模型(GB 级)不该进包, 包外资源统一由 resources.LAYOUT 管。
#   非 editable 安装会以 ResourceRootError 明确报错, 不会静默退化成"读到空配置还装没事"。
[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# 让测试不装包也能跑(装了 editable 也无害): 顺序即 sys.path 顺序
pythonpath = [
    "packages/docanon-contract/src",
    "packages/docanon-engine-ocr/src",
    "packages/docanon-engine-ner-onnx/src",
    "packages/docanon-engine-ner-llm/src",
    "packages/docanon-core/src",
]
